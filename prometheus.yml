global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'searchsurge-master'
    static_configs:
      - targets: ['searchsurge-master:9091']
        labels: { role: 'master' }

  - job_name: 'searchsurge-slaves'
    static_configs:
      - targets: ['searchsurge-slave:9091']
        labels: { role: 'slave' }