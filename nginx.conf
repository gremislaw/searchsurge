worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;
    gzip_comp_level 3;

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=top_cache:10m max_size=100m inactive=30s use_temp_path=off;

    upstream backend {
        server searchsurge-master:8080 weight=3;
        server searchsurge-slave:8080 weight=1;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location /top {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache top_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 2s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 3s;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }
    }
}