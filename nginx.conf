events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_log escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
      '"status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr","upstream_response_time":$upstream_response_time}';
    access_log /var/log/nginx/access.log json_log;

    upstream read_pool {
        zone read_pool 64k;
        least_conn;
        server searchsurge-master:8080 max_fails=3 fail_timeout=30s;
        server searchsurge-slave:8080 max_fails=3 fail_timeout=30s;
        # При масштабировании: docker compose up --scale searchsurge-slave=3
    }

    upstream write_pool {
        zone write_pool 16k;
        server searchsurge-master:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            proxy_pass http://read_pool;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        location /top {
            proxy_pass http://read_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_buffering on;
        }

        location /stoplist {
            if ($request_method != POST) {
                return 405;
            }
            proxy_pass http://write_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /metrics {
            proxy_pass http://searchsurge-master:9091;
            proxy_set_header Host $host;
        }

        location /surge.v1.TrendService/ {
            grpc_pass grpc://read_pool;
            grpc_set_header Host $host;
        }
    }
}