worker_processes auto;
events { worker_connections 1024; }

http {
    log_format main '$remote_addr - $status - $request_time - $upstream_addr';
    access_log /var/log/nginx/access.log main;

    upstream read_pool {
        least_conn;
        server searchsurge-master:8080 max_fails=3 fail_timeout=30s;
        server searchsurge-slave:8080 max_fails=3 fail_timeout=30s;
    }

    upstream write_pool {
        server searchsurge-master:8080;
    }

    server {
        listen 80;

        location /health { access_log off; proxy_pass http://read_pool; }
        location /top { proxy_pass http://read_pool; }
        location /stoplist { 
            if ($request_method != POST) { return 405; }
            proxy_pass http://write_pool; 
        }
        location /metrics { proxy_pass http://searchsurge-master:9091; }
    }
}