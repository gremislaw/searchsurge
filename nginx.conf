worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 3;
    gzip_min_length 256;
    gzip_types application/json text/plain text/css application/javascript;

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=top_cache:10m max_size=100m inactive=30s use_temp_path=off;

    upstream slaves {
        server searchsurge-slave-1:8080;
        server searchsurge-slave-2:8080;
        server searchsurge-slave-3:8080;
        server searchsurge-slave-4:8080;
        server searchsurge-slave-5:8080;
        keepalive 64;
    }

    upstream master {
        server searchsurge-master:8080;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        location ^~ /top {
            proxy_pass http://slaves;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffers 16 4k;
            proxy_buffer_size 2k;
            proxy_busy_buffers_size 8k;

            proxy_cache top_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 2s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 3s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Served-By $upstream_addr always;
        }

        location / {
            proxy_pass http://master;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffers 32 8k;
            proxy_buffer_size 4k;
            proxy_busy_buffers_size 16k;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location = /health {
            proxy_pass http://master;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /metrics {
            proxy_pass http://master;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /stoplist {
            proxy_pass http://master;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}