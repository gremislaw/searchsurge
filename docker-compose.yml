version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 3

  searchsurge-master:
    build: .
    ports: ["8080:8080", "9090:9090", "9091:9091"]
    environment:
      - ROLE=master
      - HTTP_ADDR=:8080
      - GRPC_ADDR=:9090
      - BROKER_URL=nats://nats:4222
      - BROKER_SUBJECT=search.events
      - BROKER_GROUP=searchsurge
      - HALF_LIFE_MIN=2.5
      - SNAPSHOT_INTERVAL_MS=1500
      - MAX_SNAPSHOT_SIZE=5000
      - ANOMALY_CAP=500.0
      - STALE_THRESHOLD=0.05
      - LOG_LEVEL=info
      - PROMETHEUS_ADDR=:9091
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      retries: 3

  searchsurge-slave:
    build: .
    ports: ["8081:8080", "9092:9090"]
    environment:
      - ROLE=slave
      - MASTER_ADDR=searchsurge-master:9090
      - HTTP_ADDR=:8080
      - GRPC_ADDR=:9090
      - BROKER_URL=nats://nats:4222
      - BROKER_SUBJECT=search.events
      - BROKER_GROUP=searchsurge
      - HALF_LIFE_MIN=2.5
      - SNAPSHOT_INTERVAL_MS=1500
      - MAX_SNAPSHOT_SIZE=5000
      - ANOMALY_CAP=500.0
      - STALE_THRESHOLD=0.05
      - LOG_LEVEL=info
      - PROMETHEUS_ADDR=:9093
    depends_on:
      searchsurge-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [searchsurge-master, searchsurge-slave]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9095:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro