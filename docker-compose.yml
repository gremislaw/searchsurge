version: '3.8'

services:

  nats:
    image: nats:2.10-alpine
    container_name: searchsurge-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 3
      start_period: 10s
    networks:
      - searchsurge-net
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.5' }

  searchsurge-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: searchsurge-master
    environment:
      - ROLE=master
      - HTTP_ADDR=:8080
      - GRPC_ADDR=:9090
      - PROMETHEUS_ADDR=:9091
      - DEBUG_ADDR=127.0.0.1:6060
      - BROKER_URL=nats://nats:4222
      - BROKER_SUBJECT=search.events
      - HALF_LIFE_MIN=2.5
      - SNAPSHOT_INTERVAL_MS=1500
      - MAX_SNAPSHOT_SIZE=2000
      - ANOMALY_CAP=500.0
      - STALE_THRESHOLD=0.05
      - LOG_LEVEL=info
    ports:
      - "8081:8080"
      - "9091:9091"
      - "9092:9090"
      - "127.0.0.1:6060:6060"
    depends_on:
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      retries: 3
      start_period: 15s
    networks:
      - searchsurge-net
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.5' }
    restart: unless-stopped

  searchsurge-slave:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ROLE=slave
      - MASTER_ADDR=searchsurge-master:9090
      - HTTP_ADDR=:8080
      - GRPC_ADDR=:9090
      - BROKER_URL=nats://nats:4222
      - BROKER_SUBJECT=search.events
      - PROMETHEUS_ADDR=:9091
      - HALF_LIFE_MIN=2.5
      - SNAPSHOT_INTERVAL_MS=1500
      - ANOMALY_CAP=500.0
      - MAX_SNAPSHOT_SIZE=2000
      - STALE_THRESHOLD=0.05
      - LOG_LEVEL=info
    ports:
      - "8082:8080"
    depends_on:
      searchsurge-master: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      retries: 3
      start_period: 15s
    networks:
      - searchsurge-net
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.5' }
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: searchsurge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - searchsurge-master
      - searchsurge-slave
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      retries: 3
    networks:
      - searchsurge-net
    deploy:
      resources:
        limits: { memory: 128M, cpus: '0.25' }
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: searchsurge-prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus/data
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      retries: 3
    networks:
      - searchsurge-net
    deploy:
      resources:
        limits: { memory: 512M, cpus: '0.5' }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: searchsurge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./prometheus/grafana.json:/etc/grafana/provisioning/dashboards/searchsurge.json:ro
    depends_on:
      - prometheus
    networks:
      - searchsurge-net
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.25' }
    restart: unless-stopped

volumes:
  nats-data:
  prometheus-data:
  grafana-data:

networks:
  searchsurge-net:
    driver: bridge