name: CI/CD
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Dependencies
        run: go mod download

      - name: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run ./... --timeout=5m

      - name: go fmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -w .' to fix"
            exit 1
          fi
          echo "All files formatted"

      - name: go vet + shadow check
        run: |
          go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@latest
          go vet -vettool=$(go env GOPATH)/bin/shadow ./...

      - name: Test & Coverage
        run: go test -race -coverprofile=cover.out -coverpkg=./... ./...

      - name: Build
        run: docker build -t searchsurge:ci .

      - name: Validate Compose
        run: docker compose config

  integration:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Start Docker Compose stack
        run: |
          docker compose pull
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 5

      - name: Verify services
        run: |
          curl -sf http://localhost:8081/health || exit 1
          curl -sf http://localhost:9091/metrics || exit 1
          curl -sf http://localhost:9095/-/healthy || exit 1
          echo "All services healthy"

      - name: Run integration tests
        run: |
          INTEGRATION=1 go test -v -tags=integration -timeout=5m ./tests/integration/...

      - name: Upload test artifacts (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-logs
          path: |
            docker-compose-logs.txt
          retention-days: 3
        continue-on-error: true

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs > docker-compose-logs.txt
          cat docker-compose-logs.txt

      - name: Cleanup
        run: docker compose down -v
        if: always()

  release:
    needs: integration
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max