name: CI/CD
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Dependencies
        run: go mod download

      - name: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run ./... --timeout=5m

      - name: go fmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Unformatted files:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -w .' to fix"
            exit 1
          fi
          echo "✅ All files formatted"

      - name: go vet + shadow check
        run: |
          go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@latest
          o vet -vettool=$(go env GOPATH)/bin/shadow ./...

      - name: Test & Coverage
        run: go test -race -coverprofile=cover.out -coverpkg=./... ./...

      - name: Build
        run: docker build -t searchsurge:ci .

      - name: Validate Compose
        run: docker compose config

  release:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max