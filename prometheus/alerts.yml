groups:
  - name: searchsurge-alerts
    rules:
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(searchsurge_snapshot_latency_seconds_bucket[5m])) > 0.02
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency > 20ms"
          description: "Snapshot build latency exceeded SLO on {{ $labels.instance }}"

      - alert: HighIngestDropRate
        expr: rate(searchsurge_ingest_dropped_total[5m]) / rate(searchsurge_events_processed_total[5m]) > 0.1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Ingest drop rate > 10%"
          description: "Too many events dropped on {{ $labels.instance }}"

      - alert: ServiceDown
        expr: up{job=~"searchsurge.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} down"
          description: "Instance {{ $labels.instance }} is not responding"

      - alert: LowActiveEntries
        expr: searchsurge_active_entries < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low active queries"
          description: "Only {{ $value }} unique queries tracked on {{ $labels.instance }}"